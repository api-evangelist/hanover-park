aid: hanover-park
name: Hanover Park
description: 'Hanover Park is an AI-native ERP and fund administration platform for private
  market investors, unifying fund accounting, portfolio intelligence, and the LP experience
  in a single system of record. It pairs a proprietary general ledger, waterfall engine,
  investor portal, and portfolio management layer with AI agents that read email, propose
  journal entries, and extract portfolio updates, all reviewed by expert fund accountants.
  The platform automates capital calls, cash reconciliation, general-ledger posting, KPI
  collection, and reporting for venture capital, private equity, and other private-market
  firms. Founded in 2024 and headquartered around a modern back-office thesis, Hanover Park
  raised a $27M Series A led by Emergence Capital (with Lux Capital and Susa Ventures) and
  has grown from $1B to $15B in assets under administration. The company is SOC 1 Type II
  and SOC 2 Type II certified with a zero-trust, client-isolated AI architecture. No public
  API or developer program is published at this time; the product is delivered as a
  login-gated SaaS application.'
